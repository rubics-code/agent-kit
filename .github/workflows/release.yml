name: release

# Publishes to npm when a GitHub release is published. The tag sets the
# version: release v0.2.0 publishes 0.2.0, so package.json needs no bump.
#
# Auth: trusted publishing (OIDC), so no npm token is stored. npm lets you add
# a trusted publisher only to a package that exists, so the first release can
# use an NPM_TOKEN secret in the npm environment instead. Delete that secret
# after the first release.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Set the version from the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>." >&2; exit 1 ;;
          esac
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm test
      # A prerelease (for example v0.2.0-rc.1) goes to the next tag, not latest.
      - name: Publish with the first-release token
        if: env.HAS_TOKEN == 'true'
        run: npm publish --provenance --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with trusted publishing
        if: env.HAS_TOKEN != 'true'
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
