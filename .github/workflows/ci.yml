name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run pack-check

  # The ADK Go spike is its own Go module. It needs no key: the live tests are manual.
  spike-adk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/adk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spike/adk/go.mod
          cache-dependency-path: spike/adk/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/adk/web/package-lock.json
      - run: npm ci
        working-directory: spike/adk/web
      - run: npm run build
        working-directory: spike/adk/web

  # The Go Kit (root Go module) and the web client in web/. The browser tests
  # use the dev agent with the fake model, so they need no key. The last step
  # runs them against one binary with the console embedded.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd kit web/embed.go web/embed_test.go)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: npm run e2e:embed
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
